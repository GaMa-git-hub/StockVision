{% for it in items %}
<tr data-id="{{ it.id }}" data-symbol="{{ it.symbol }}" data-ex="{{ it.exchange }}">

    <td class="col-symbol">{{ it.symbol }}</td>

    <td class="col-name">{{ it.company_name }}</td>

    <td class="col-price price-cell">
        {{ it.price if it.price != None else "—" }}
    </td>

    <td class="col-change change-cell">
        {% if it.change != None %}
            <span class="{{ 'gain-positive' if it.change >= 0 else 'gain-negative' }}">
                {{ it.change }}
            </span>
        {% else %}
            —
        {% endif %}
    </td>

    <td class="col-pct pct-cell">
        {% if it.percent_change != None %}
            <span class="{{ 'gain-positive' if it.percent_change >= 0 else 'gain-negative' }}">
                {{ it.percent_change }}%
            </span>
        {% else %}
            —
        {% endif %}
    </td>

    <td class="col-action">
        <a href="/watchlist/item/{{ it.id }}/delete" class="delete-btn">Delete</a>
    </td>

</tr>
{% endfor %}
